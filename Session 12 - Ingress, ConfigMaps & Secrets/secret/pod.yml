apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo '--- from env ---'; echo DB_USER=$DB_USER; echo '--- from file ---'; cat /secrets/DB_PASSWORD; echo; sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
      volumeMounts:
        - name: secret-volume
          mountPath: /secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: app-secret
