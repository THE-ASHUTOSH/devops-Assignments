apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: visitor-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: visitor-app
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
