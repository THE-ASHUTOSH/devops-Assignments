apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # 0 means never drop below 2 ready during an update
  selector:
    matchLabels: { app: visitor-app }
  template:
    metadata:
      labels: { app: visitor-app }
    spec:
      containers:
        - name: app
          image: visitor-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: visitor-config }
            - secretRef: { name: visitor-secret }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 128Mi }
          startupProbe:
            httpGet: { path: /health, port: 3000 }
            failureThreshold: 10
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
