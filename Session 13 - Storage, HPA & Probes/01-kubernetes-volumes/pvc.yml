apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  # no storageClassName, so it uses the default one and gets provisioned automatically
---
apiVersion: v1
kind: Pod
metadata:
  name: vol-pvc
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'survives a pod restart' > /data/persist.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-pvc
