apiVersion: v1
kind: Pod
metadata:
  name: vol-emptydir
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo written by writer > /shared/note.txt; sleep 3600"]
      volumeMounts:
        - name: shared
          mountPath: /shared
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 5; cat /shared/note.txt; sleep 3600"]
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      emptyDir: {}      # lives and dies with the pod, shared by both containers
