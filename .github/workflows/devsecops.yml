name: DevSecOps Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Session 17 - DevSecOps/**'

env:
  APP_DIR: Session 16 - CI-CD & GitHub Actions/app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm install
      - name: Unit tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

  # SAST - scan our own source code for bad patterns
  sast:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  # SCA - scan our dependencies for known CVEs
  sca:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit
        working-directory: ${{ env.APP_DIR }}
        run: npm audit --audit-level=high

  # Secret scanning - catch committed credentials
  secret-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks needs full history
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Container image scan - only after the code scans pass
  image-scan:
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        working-directory: ${{ env.APP_DIR }}
        run: docker build -t demo:${{ github.sha }} .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: demo:${{ github.sha }}
          format: table
          exit-code: '1'            # THIS is the security gate - fail on findings
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # Everything above passed, so the image is allowed through
  push-image:
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - uses: actions/checkout@v4
      - name: Would push to registry here
        run: |
          echo "All security gates passed."
          echo "docker push ghcr.io/${{ github.repository }}:${{ github.sha }}"

  deploy:
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - uses: actions/checkout@v4
      - name: Would deploy to Kubernetes here
        run: |
          echo "kubectl apply -f 'Session 17 - DevSecOps/kubernetes/'"
          echo "kubectl rollout status deployment/demo"
